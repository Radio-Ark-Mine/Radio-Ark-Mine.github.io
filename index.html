<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>رادیو ارک ماین</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

:root {
  --font-fa: "Vazirmatn", "Segoe UI", Tahoma, "Iranian Sans", system-ui, -apple-system, sans-serif;
  --accent: #2dd4bf;
  --accent-light: #a5f3fc;
  --accent-dark: #0f766e;
  --bg-dark: #0b0e14;
  --bg-mid: #161b26;
  --panel: rgba(20, 25, 35, 0.97);
  --danger: #ef4444;
  --text-main: #ffffff;
  --text-muted: #9ca3af;
}

html {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  width: 100%;
  height: 100vh;
  height: calc(var(--vh, 1vh) * 100);
  height: 100dvh;
  overflow: hidden;
  font-family: var(--font-fa);
  background: radial-gradient(circle at 50% 20%, #1a2333 0%, var(--bg-dark) 80%);
  display: flex;
  justify-content: center;
  align-items: center;
  padding:
    calc(10px + env(safe-area-inset-top, 0px))
    calc(10px + env(safe-area-inset-right, 0px))
    calc(10px + env(safe-area-inset-bottom, 0px))
    calc(10px + env(safe-area-inset-left, 0px));
  color: var(--text-main);
  -webkit-user-select: none;
  user-select: none;
  position: fixed;
  inset: 0;
  line-height: 1.4;
}

/* Radio Main Container */
.radio {
  width: 100%;
  max-width: 420px;
  height: 100%;
  max-height: 860px;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: var(--panel);
  border-radius: 32px;
  padding: 20px 16px;
  box-shadow:
    0 20px 50px rgba(0, 0, 0, 0.8),
    0 0 0 1px rgba(45, 212, 191, 0.3);
  border: 1px solid rgba(45, 212, 191, 0.2);
  isolation: isolate;
  scrollbar-width: thin;
  scrollbar-color: rgba(45, 212, 191, 0.3) transparent;
  display: flex;
  flex-direction: column;
  position: relative;
}

.radio::-webkit-scrollbar { width: 4px; }
.radio::-webkit-scrollbar-thumb {
  background: rgba(45, 212, 191, 0.3);
  border-radius: 4px;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding: 0 4px;
  gap: 8px;
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: clamp(0.95rem, 4vw, 1.15rem);
  font-weight: bold;
  background: linear-gradient(135deg, var(--accent-light), var(--accent));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}

.brand i {
  color: var(--accent);
  -webkit-text-fill-color: var(--accent);
  font-size: 1.3rem;
  flex-shrink: 0;
}

.live {
  background: var(--danger);
  color: #fff;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
  box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
  transition: opacity 0.3s ease, background 0.3s ease;
}

.live i { font-size: 0.5rem; }

/* فقط وقتی واقعاً پخش زنده در جریان است انیمیشن دارد */
.live.on { animation: pulse 2s infinite ease-in-out; }
.live.on i { animation: blink 1.5s infinite; }
.live.off { background: #4b5563; box-shadow: none; opacity: 0.7; }

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Nav Tabs */
.tab-navigation {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-shrink: 0;
}

.nav-tab {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-muted);
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  user-select: none;
  touch-action: manipulation;
}

.nav-tab:hover {
  background: rgba(255, 255, 255, 0.07);
  color: #fff;
}

.nav-tab.active {
  background: var(--accent);
  color: #0b0e14;
  border-color: var(--accent);
  box-shadow: 0 4px 15px rgba(45, 212, 191, 0.35);
}

/* Cover & Visualizer */
.cover {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  max-height: 270px;
  border-radius: 24px;
  overflow: hidden;
  margin-bottom: 14px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
  background: linear-gradient(145deg, var(--bg-dark), var(--accent-dark));
  flex-shrink: 0;
  contain: layout paint;
}

.cover img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity 0.4s ease;
  filter: brightness(0.9) saturate(1.2);
  z-index: 1;
}

.cover img.fade-out { opacity: 0; }

.visualizer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
  display: block;
}

.cover::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 55%, rgba(45, 212, 191, 0.05), transparent 40%),
    linear-gradient(to top, rgba(0, 0, 0, 0.4), transparent 45%);
}

.waves {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 70px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 4px;
  padding-bottom: 8px;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
  pointer-events: none;
  z-index: 4;
}

.bar {
  width: 4px;
  background: var(--accent);
  border-radius: 3px;
  transform-origin: bottom center;
  animation: wave 1.2s infinite ease-in-out;
  will-change: transform;
}

.bar:nth-child(1) { height: 15px; animation-delay: 0s; }
.bar:nth-child(2) { height: 30px; animation-delay: 0.1s; }
.bar:nth-child(3) { height: 45px; animation-delay: 0.2s; }
.bar:nth-child(4) { height: 25px; animation-delay: 0.3s; }
.bar:nth-child(5) { height: 50px; animation-delay: 0.4s; }
.bar:nth-child(6) { height: 35px; animation-delay: 0.5s; }
.bar:nth-child(7) { height: 20px; animation-delay: 0.6s; }
.bar:nth-child(8) { height: 45px; animation-delay: 0.7s; }
.bar:nth-child(9) { height: 30px; animation-delay: 0.8s; }
.bar:nth-child(10) { height: 15px; animation-delay: 0.9s; }

@keyframes wave {
  0%, 100% { transform: scaleY(0.5); opacity: 0.5; }
  50% { transform: scaleY(1.6); opacity: 1; }
}

.paused .bar {
  animation: none;
  transform: scaleY(0.5);
  opacity: 0.5;
  will-change: auto;
}

/* Info Section */
.info {
  text-align: center;
  margin-bottom: 14px;
  flex-shrink: 0;
}

.title {
  color: #fff;
  font-size: clamp(1rem, 4.2vw, 1.1rem);
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 0 12px rgba(45, 212, 191, 0.5);
  margin-bottom: 4px;
  min-height: 22px;
  unicode-bidi: plaintext;
}

.artist {
  color: var(--text-muted);
  font-size: clamp(0.75rem, 3.2vw, 0.85rem);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-height: 18px;
  unicode-bidi: plaintext;
}

/* Controls */
.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  margin-bottom: 14px;
  flex-shrink: 0;
}

.btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #d1d5db;
  width: 48px;
  height: 48px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 50%;
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.3s ease, opacity 0.3s ease;
  user-select: none;
  touch-action: manipulation;
}

.btn:active { transform: scale(0.9); }

.btn.play {
  width: 66px;
  height: 66px;
  font-size: 1.7rem;
  background: linear-gradient(145deg, var(--accent-dark), var(--accent));
  color: var(--bg-dark);
  border: none;
  box-shadow: 0 8px 20px rgba(45, 212, 191, 0.4);
  transition: transform 0.15s ease, box-shadow 0.3s ease, opacity 0.3s ease;
  flex-shrink: 0;
  padding: 0;
}

.genre.disabled {
  opacity: 0.5;
  cursor: not-allowed;
  pointer-events: none;
  transform: none !important;
}

.btn.play:active {
  transform: scale(0.93);
  box-shadow: 0 4px 12px rgba(45, 212, 191, 0.5);
}

.btn.play.loading i { animation: spin 1s linear infinite; }

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Volume Wrap */
.volume-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding: 0 6px;
  flex-shrink: 0;
}

.volume-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--accent);
  width: 42px;
  height: 42px;
  min-width: 42px;
  min-height: 42px;
  border-radius: 50%;
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.25s ease, color 0.25s ease;
  flex-shrink: 0;
  user-select: none;
  touch-action: manipulation;
}

.volume-btn:active { transform: scale(0.9); }

.volume-btn.mute {
  color: var(--danger);
  border-color: rgba(239, 68, 68, 0.4);
}

.volume-slider {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  width: 100%;
  min-width: 0;
  height: 32px;
  background: transparent;
  outline: none;
  cursor: pointer;
  direction: ltr;
  margin: 0;
  padding: 0;
  touch-action: pan-y;
  user-select: none;
  background-image: linear-gradient(
    to right,
    var(--accent) 0%,
    var(--accent) var(--vol-percent, 100%),
    rgba(255, 255, 255, 0.12) var(--vol-percent, 100%),
    rgba(255, 255, 255, 0.12) 100%
  );
  background-size: 100% 6px;
  background-repeat: no-repeat;
  background-position: center;
  border-radius: 3px;
}

.volume-slider::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 3px;
  background: transparent;
}

.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  margin-top: -6px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg-dark);
  box-shadow: 0 0 8px rgba(45, 212, 191, 0.6);
  cursor: grab;
}

.volume-slider::-webkit-slider-thumb:active { cursor: grabbing; }

/* Firefox */
.volume-slider::-moz-range-track {
  height: 6px;
  border-radius: 3px;
  background: transparent;
}
.volume-slider::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg-dark);
  box-shadow: 0 0 8px rgba(45, 212, 191, 0.6);
  cursor: grab;
}

.volume-value {
  color: var(--accent-light);
  font-size: 0.7rem;
  min-width: 38px;
  text-align: center;
  font-weight: bold;
  text-shadow: 0 0 8px rgba(45, 212, 191, 0.5);
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  direction: ltr;
}

/* Tab Views */
.tab-view { display: none; }
.tab-view.active { display: block; }

/* Add Stream Btn */
.btn-add-stream {
  width: 100%;
  padding: 10px;
  background: rgba(45, 212, 191, 0.1);
  border: 1px dashed var(--accent);
  border-radius: 12px;
  color: var(--accent);
  font-size: 0.8rem;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  margin-bottom: 12px;
  transition: background 0.25s ease;
  font-family: inherit;
  touch-action: manipulation;
}

.btn-add-stream:hover { background: rgba(45, 212, 191, 0.2); }

/* Genres Grid */
.genres {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}

.genre {
  position: relative;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
  padding: 8px 4px;
  font-size: clamp(0.6rem, 2.6vw, 0.7rem);
  color: var(--text-muted);
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.25s ease,
              border-color 0.25s ease, color 0.25s ease, opacity 0.3s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  user-select: none;
  touch-action: manipulation;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  unicode-bidi: plaintext;
}

.genre i {
  display: block;
  font-size: 0.9rem;
  margin-bottom: 3px;
  color: var(--accent);
}

.genre-label {
  display: block;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.genre-del {
  position: absolute;
  top: 1px;
  inset-inline-start: 2px;
  width: 20px;
  height: 20px;
  border: none;
  background: transparent;
  color: var(--danger);
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
  opacity: 0.75;
  font-family: inherit;
}

.genre-del:hover { opacity: 1; }

.genre.active {
  background: rgba(45, 212, 191, 0.15);
  border-color: var(--accent);
  color: var(--accent-light);
  box-shadow: 0 0 10px rgba(45, 212, 191, 0.25);
}

.genre:active { transform: scale(0.95); }

/* File Upload & Playlist View */
.file-upload-box {
  border: 2px dashed rgba(255, 255, 255, 0.15);
  border-radius: 16px;
  padding: 16px;
  text-align: center;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.02);
  transition: border-color 0.2s ease, background 0.2s ease;
  margin-bottom: 12px;
}

.file-upload-box:hover, .file-upload-box.dragover {
  border-color: var(--accent);
  background: rgba(45, 212, 191, 0.05);
}

.file-upload-box i {
  font-size: 1.6rem;
  color: var(--accent);
  margin-bottom: 6px;
}

.file-upload-box p {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.playlist {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 180px;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.playlist-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 10px;
  font-size: 0.75rem;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.playlist-item:hover { background: rgba(255, 255, 255, 0.07); }

.playlist-item.active {
  border-color: var(--accent);
  background: rgba(45, 212, 191, 0.12);
  color: var(--accent-light);
}

.item-info {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  min-width: 0;
}

.item-info span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  unicode-bidi: plaintext;
}

.item-remove {
  color: var(--danger);
  padding: 8px;
  cursor: pointer;
  opacity: 0.7;
  flex-shrink: 0;
}

.item-remove:hover { opacity: 1; }

/* Status Bar */
.status {
  text-align: center;
  font-size: 0.7rem;
  color: #6b7280;
  margin-top: 10px;
  min-height: 14px;
  line-height: 1.4;
  flex-shrink: 0;
}

/* Modal Popup (بیرون از .radio تا هنگام اسکرول جابه‌جا نشود) */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(11, 14, 20, 0.88);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.modal-card {
  width: 100%;
  max-width: 440px;
  background: #141b26;
  border-top-left-radius: 28px;
  border-top-right-radius: 28px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
  position: relative;
  color: var(--text-main);
  font-family: var(--font-fa);
}

.modal-backdrop.open .modal-card { transform: translateY(0); }

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.modal-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
}

.modal-close {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #fff;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.form-group { margin-bottom: 14px; }

.form-label {
  display: block;
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-bottom: 6px;
  text-align: right;
}

.form-input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px;
  color: #fff;
  font-family: inherit;
  font-size: 16px; /* جلوگیری از زوم خودکار iOS */
  outline: none;
  transition: border-color 0.2s;
  direction: rtl;
  -webkit-user-select: text;
  user-select: text;
}

.form-input.ltr { direction: ltr; text-align: left; }
.form-input:focus { border-color: var(--accent); }

.form-error {
  color: var(--danger);
  font-size: 0.75rem;
  min-height: 16px;
  margin-top: -4px;
}

.modal-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 16px;
  gap: 10px;
}

.btn-cancel {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  padding: 10px 16px;
  font-family: inherit;
}

.btn-submit {
  background: var(--accent);
  color: #0b0e14;
  border: none;
  border-radius: 16px;
  padding: 12px 28px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(45, 212, 191, 0.3);
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
}

.btn:focus-visible,
.volume-btn:focus-visible,
.genre:focus-visible,
.nav-tab:focus-visible,
.volume-slider:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

@media (max-width: 360px) {
  .radio { border-radius: 24px; padding: 14px 12px; }
  .brand span { display: none; }
  .brand i { font-size: 1.5rem; }
  .genre { padding: 6px 2px; font-size: 0.6rem; }
}

@media (min-width: 768px) {
  .radio { max-width: 440px; padding: 22px 20px; }
  .genre { font-size: 0.72rem; }
}

@media (hover: hover) and (pointer: fine) {
  .genre:hover {
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(45, 212, 191, 0.4);
  }
  .btn:hover { background: rgba(255, 255, 255, 0.1); }
  .volume-btn:hover { background: rgba(45, 212, 191, 0.15); }
}

@media (prefers-reduced-motion: reduce) {
  .bar, .live.on, .live.on i { animation: none !important; }
}
</style>
</head>
<body>

<div class="radio" id="radio">
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <i class="fas fa-broadcast-tower"></i>
      <span>رادیو ارک ماین</span>
    </div>
    <div class="live off" id="liveBadge">
      <i class="fas fa-circle"></i> زنده
    </div>
  </div>

  <!-- Navigation Tabs -->
  <div class="tab-navigation">
    <button class="nav-tab active" id="tabRadioBtn" type="button">
      <i class="fas fa-link"></i>
      رادیو / لینک
    </button>
    <button class="nav-tab" id="tabFilesBtn" type="button">
      <i class="fas fa-upload"></i>
      فایل‌های من
    </button>
  </div>

  <!-- Artwork & Visualizer -->
  <div class="cover">
    <img id="cover" alt="cover" decoding="async">
    <canvas id="visualizer" class="visualizer"></canvas>
    <div class="waves paused" id="waves" aria-hidden="true">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <!-- Song Info -->
  <div class="info">
    <div class="title" id="title">SMOKED OUT</div>
    <div class="artist" id="artist">PRXSXNT FXTURE • Phonk</div>
  </div>

  <!-- Play Controls -->
  <div class="controls">
    <button class="btn" id="prevBtn" type="button" title="قبلی" aria-label="قبلی" style="display:none;">
      <i class="fas fa-step-backward"></i>
    </button>
    <button class="btn play" id="play" type="button" aria-label="پخش/توقف">
      <i class="fas fa-play" id="playIcon"></i>
    </button>
    <button class="btn" id="nextBtn" type="button" title="بعدی" aria-label="بعدی" style="display:none;">
      <i class="fas fa-step-forward"></i>
    </button>
  </div>

  <!-- Volume Controller -->
  <div class="volume-wrap">
    <button class="volume-btn" id="muteBtn" type="button" title="بی‌صدا / وصل صدا" aria-label="بی‌صدا">
      <i class="fas fa-volume-high" id="muteIcon"></i>
    </button>
    <input type="range" class="volume-slider" id="volumeSlider"
           min="0" max="100" step="1" value="100"
           aria-label="میزان صدا">
    <span class="volume-value" id="volumeValue">100%</span>
  </div>

  <!-- TAB 1: Radio Genres & Custom Streams -->
  <div class="tab-view active" id="radioTabView">
    <button class="btn-add-stream" id="openModalBtn" type="button">
      <i class="fas fa-plus"></i>
      افزودن رادیو / استریم سفارشی
    </button>

    <div class="genres" id="genres">
      <div class="genre active" data-stream="phonk" tabindex="0" role="button"><i class="fas fa-headphones"></i>فونک</div>
      <div class="genre" data-stream="phonk2" tabindex="0" role="button"><i class="fas fa-fire"></i>فونک۲</div>
      <div class="genre" data-stream="persian" tabindex="0" role="button"><i class="fas fa-heart"></i>فارسی</div>
      <div class="genre" data-stream="lofi" tabindex="0" role="button"><i class="fas fa-moon"></i>لوفای</div>
      <div class="genre" data-stream="soul" tabindex="0" role="button"><i class="fas fa-sun"></i>سول</div>
      <div class="genre" data-stream="rock" tabindex="0" role="button"><i class="fas fa-guitar"></i>راک</div>
      <div class="genre" data-stream="pop" tabindex="0" role="button"><i class="fas fa-star"></i>پاپ</div>
      <div class="genre" data-stream="hiphop" tabindex="0" role="button"><i class="fas fa-microphone"></i>هیپ‌هاپ</div>
      <div class="genre" data-stream="country" tabindex="0" role="button"><i class="fas fa-hat-cowboy"></i>کانتری</div>
      <div class="genre" data-stream="ost" tabindex="0" role="button"><i class="fas fa-film"></i>متن فیلم</div>
      <div class="genre" data-stream="pop2" tabindex="0" role="button"><i class="fas fa-music"></i>پاپ۲</div>
      <div class="genre" data-stream="persianrap" tabindex="0" role="button"><i class="fas fa-microphone-lines"></i>رپ فارسی</div>
      <div class="genre" data-stream="relaxing" tabindex="0" role="button"><i class="fas fa-spa"></i>ریلکسینگ</div>
    </div>
  </div>

  <!-- TAB 2: My Local Files -->
  <div class="tab-view" id="filesTabView">
    <div class="file-upload-box" id="dropZone">
      <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac,.opus" multiple style="display: none;">
      <i class="fas fa-cloud-arrow-up"></i>
      <p>انتخاب یا کشیدن فایل‌های صوتی به اینجا</p>
    </div>
    <div class="playlist" id="playlist"></div>
  </div>

  <!-- Status Bar -->
  <div class="status" id="status" role="status" aria-live="polite">برای پخش، دکمه ▶️ را بزن</div>
</div>

<!-- Add Stream Modal Popup -->
<div class="modal-backdrop" id="addStreamModal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">افزودن رادیو / استریم</div>
      <button class="modal-close" id="closeModalBtn" type="button" aria-label="بستن"><i class="fas fa-times"></i></button>
    </div>
    <div class="form-group">
      <label class="form-label" for="streamNameInput">نام</label>
      <input type="text" class="form-input" id="streamNameInput" placeholder="نام ایستگاه یا آهنگ" maxlength="40" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label" for="streamUrlInput">آدرس مستقیم صدا</label>
      <input type="url" class="form-input ltr" id="streamUrlInput" placeholder="https://example.com/radio.mp3" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="form-error" id="formError"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelModalBtn" type="button">انصراف</button>
      <button class="btn-submit" id="saveStreamBtn" type="button">
        <i class="fas fa-plus"></i>
        افزودن
      </button>
    </div>
  </div>
</div>

<audio id="audio" preload="none" crossorigin="anonymous"></audio>

<script>
(function () {
  "use strict";

  /* ---------- ابزارها ---------- */
  const $ = (id) => document.getElementById(id);

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (_) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
  };

  let vhRaf = 0;
  function setVH() {
    cancelAnimationFrame(vhRaf);
    vhRaf = requestAnimationFrame(() => {
      document.documentElement.style.setProperty("--vh", (window.innerHeight * 0.01) + "px");
    });
  }
  setVH();
  window.addEventListener("resize", setVH, { passive: true });
  window.addEventListener("orientationchange", () => setTimeout(setVH, 200));

  /* ---------- المان‌ها ---------- */
  // audioCors: به گراف WebAudio وصل می‌شود (ویژوالایزر + کنترل صدا)
  // audioPlain: بدون crossorigin، برای استریم‌هایی که سرورشان CORS ندارد
  const audioCors  = $("audio");
  const audioPlain = new Audio();
  audioPlain.preload = "none";
  let audio = audioCors;

  const playBtn    = $("play");
  const playIcon   = $("playIcon");
  const prevBtn    = $("prevBtn");
  const nextBtn    = $("nextBtn");
  const waves      = $("waves");
  const cover      = $("cover");
  const title      = $("title");
  const artist     = $("artist");
  const statusEl   = $("status");
  const liveBadge  = $("liveBadge");
  const genresContainer = $("genres");
  const canvas     = $("visualizer");
  const ctx        = canvas.getContext("2d", { alpha: true });

  const volumeSlider = $("volumeSlider");
  const volumeValue  = $("volumeValue");
  const muteBtn      = $("muteBtn");
  const muteIcon     = $("muteIcon");

  const tabRadioBtn  = $("tabRadioBtn");
  const tabFilesBtn  = $("tabFilesBtn");
  const radioTabView = $("radioTabView");
  const filesTabView = $("filesTabView");

  const openModalBtn    = $("openModalBtn");
  const closeModalBtn   = $("closeModalBtn");
  const cancelModalBtn  = $("cancelModalBtn");
  const addStreamModal  = $("addStreamModal");
  const saveStreamBtn   = $("saveStreamBtn");
  const streamNameInput = $("streamNameInput");
  const streamUrlInput  = $("streamUrlInput");
  const formError       = $("formError");

  const dropZone  = $("dropZone");
  const fileInput = $("fileInput");
  const playlist  = $("playlist");

  const FALLBACK_IMG = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0%" stop-color="#0b0e14"/><stop offset="100%" stop-color="#0f766e"/>' +
    '</linearGradient></defs>' +
    '<rect width="600" height="600" fill="url(#g)"/>' +
    '<circle cx="300" cy="300" r="140" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-dasharray="18, 12" opacity="0.4"/>' +
    '<circle cx="300" cy="300" r="70" fill="none" stroke="#2dd4bf" stroke-width="3" opacity="0.6"/>' +
    '<circle cx="300" cy="300" r="15" fill="#2dd4bf" opacity="0.8"/></svg>'
  );

  const DEFAULT_STATUS = "برای پخش، دکمه ▶️ را بزن";
  const MAX_RETRIES = 6;

  /* ---------- وضعیت ---------- */
  let playing = false;        // قصد کاربر: در حال پخش (یا تلاش برای پخش)
  let loading = false;
  let mode = null;            // "live" | "file" | null
  let activeTab = "radio";
  let currentGenre = "phonk";
  let coverIndex = 0;
  let coverTimer = null;
  let coverSwapTimer = null;
  let playRequestId = 0;
  let retryTimer = null;
  let waitTimer = null;
  let retryCount = 0;
  let saveVolTimer = null;

  let localPlaylist = [];
  let currentFileIndex = -1;

  let customStreams = [];
  try {
    const parsed = JSON.parse(store.get("customRadioStreams", "[]"));
    if (Array.isArray(parsed)) {
      customStreams = parsed.filter(s => s && typeof s.name === "string" && typeof s.url === "string");
    }
  } catch (_) { customStreams = []; }
  const saveStreams = () => store.set("customRadioStreams", JSON.stringify(customStreams));

  let currentVolume = parseFloat(store.get("radioVol", "1"));
  if (isNaN(currentVolume) || currentVolume < 0 || currentVolume > 1) currentVolume = 1;
  let lastVolume = currentVolume > 0 ? currentVolume : 1;

  const BASE_URL = (location.protocol === "https:" ? "https://" : "http://") + "radio.9craft.ir:7443/";

  const genresData = {
    phonk:  { title: "SMOKED OUT", artist: "PRXSXNT FXTURE • Phonk", covers: ["https://picsum.photos/seed/phonk1/600","https://picsum.photos/seed/phonk2/600"] },
    phonk2: { title: "MONTAGEM GREEN", artist: "Tsk.4 • Phonk2", covers: ["https://picsum.photos/seed/phonk2a/600","https://picsum.photos/seed/phonk2b/600"] },
    persian:{ title: "Zemestoon", artist: "Afshin Moghadam • Persian", covers: ["https://picsum.photos/seed/persian1/600","https://picsum.photos/seed/persian2/600"] },
    lofi:   { title: "Crépuscule", artist: "DLJ • Lofi", covers: ["https://picsum.photos/seed/lofi1/600","https://picsum.photos/seed/lofi2/600"] },
    soul:   { title: "Soul", artist: "Radio • Soul", covers: ["https://picsum.photos/seed/soul1/600","https://picsum.photos/seed/soul2/600"] },
    rock:   { title: "Rock", artist: "Radio • Rock", covers: ["https://picsum.photos/seed/rock1/600","https://picsum.photos/seed/rock2/600"] },
    pop:    { title: "Pop", artist: "Radio • Pop", covers: ["https://picsum.photos/seed/pop1/600","https://picsum.photos/seed/pop2/600"] },
    hiphop: { title: "Hip-Hop", artist: "Radio • Hip-Hop", covers: ["https://picsum.photos/seed/hiphop1/600","https://picsum.photos/seed/hiphop2/600"] },
    country:{ title: "Country", artist: "Radio • Country", covers: ["https://picsum.photos/seed/country1/600","https://picsum.photos/seed/country2/600"] },
    ost:     { title: "OST", artist: "Radio • OST", urlPath: "ost", covers: ["https://picsum.photos/seed/ost1/600"] },
    pop2:    { title: "Pop 2", artist: "Radio • Pop 2", urlPath: "pop2", covers: ["https://picsum.photos/seed/pop2a/600"] },
    persianrap: { title: "Persian Rap", artist: "Radio • Persian Rap", urlPath: "prap", covers: ["https://picsum.photos/seed/rap1/600"] },
    relaxing:{ title: "Relaxing", artist: "Radio • Relaxing", urlPath: "relax", covers: ["https://picsum.photos/seed/relax1/600"] }
  };

  /* ---------- گراف صوتی ---------- */
  let audioContext = null, analyser = null, sourceNode = null, gainNode = null;
  let audioGraphReady = false;
  const freqData = new Uint8Array(128);
  const timeData = new Uint8Array(256);

  const graphActive = () => audioGraphReady && audio === audioCors;

  function setupAudioGraph() {
    if (audioGraphReady) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw new Error("Web Audio API unavailable");
      audioContext = new AC();
      sourceNode = audioContext.createMediaElementSource(audioCors);
      gainNode = audioContext.createGain();
      gainNode.gain.value = currentVolume;
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.8;
      sourceNode.connect(gainNode);
      gainNode.connect(analyser);
      analyser.connect(audioContext.destination);
      audioGraphReady = true;
      audioCors.volume = 1; // صدا فقط از gain کنترل می‌شود (قبلاً دو بار اعمال می‌شد)
      return true;
    } catch (err) {
      console.warn("Web Audio unavailable:", err);
      return false;
    }
  }

  async function resumeContext() {
    if (audioContext && audioContext.state === "suspended") {
      try { await audioContext.resume(); } catch (_) {}
    }
  }

  /* ---------- ویژوالایزر ---------- */
  let cw = 0, ch = 0;
  let rafId = 0;
  let lastFrame = 0;
  const FRAME_INTERVAL = 1000 / 30;

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    cw = rect.width;
    ch = rect.height;
    canvas.width = Math.max(1, Math.floor(cw * dpr));
    canvas.height = Math.max(1, Math.floor(ch * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function fillFakeData(now) {
    const n = freqData.length;
    for (let i = 0; i < n; i++) {
      const v = (0.35 + 0.35 * Math.sin(now / 300 + i * 0.35) * Math.sin(now / 900 + i * 0.1)) * (1 - (i / n) * 0.7);
      freqData[i] = Math.max(0, Math.min(255, v * 255));
    }
    for (let i = 0; i < timeData.length; i++) {
      timeData[i] = 128 + Math.sin(now / 200 + i * 0.3) * 20;
    }
  }

  function drawVisualizer(now) {
    rafId = requestAnimationFrame(drawVisualizer);
    if (now - lastFrame < FRAME_INTERVAL) return;
    lastFrame = now;
    if (!cw || !ch) return;

    ctx.clearRect(0, 0, cw, ch);

    if (graphActive() && analyser && !audio.paused && audio.readyState > 2) {
      analyser.getByteFrequencyData(freqData);
      analyser.getByteTimeDomainData(timeData);
    } else {
      fillFakeData(now);
    }

    let bassSum = 0, level = 0;
    const n = freqData.length;
    const bassN = Math.max(1, Math.floor(n * 0.12));
    for (let i = 0; i < n; i++) {
      const v = freqData[i] / 255;
      level += v;
      if (i < bassN) bassSum += v;
    }
    level /= n;
    const bass = bassSum / bassN;

    const pulse = 1 + Math.min(0.15, bass * 0.2 + level * 0.05);
    const cx = cw / 2, cy = ch * 0.53;
    const minDim = Math.min(cw, ch);
    const radius = minDim * 0.22 * pulse;

    ctx.fillStyle = "rgba(45,212,191,0.15)";
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();

    const bars = 50;
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(45,212,191," + (0.5 + level * 0.4).toFixed(2) + ")";
    ctx.beginPath();
    for (let i = 0; i < bars; i++) {
      const idx = Math.floor(i * (n * 0.8) / bars);
      const value = freqData[idx] / 255;
      const angle = (Math.PI * 2 * i) / bars - Math.PI / 2;
      const inner = radius + 3;
      const outer = inner + 5 + value * minDim * 0.12;
      const cos = Math.cos(angle), sin = Math.sin(angle);
      ctx.moveTo(cx + cos * inner, cy + sin * inner);
      ctx.lineTo(cx + cos * outer, cy + sin * outer);
    }
    ctx.stroke();

    ctx.beginPath();
    for (let x = 0; x <= cw; x += 4) {
      const i = Math.floor((x / cw) * (timeData.length - 1));
      const sample = (timeData[i] - 128) / 128;
      const y = ch - 20 - sample * (15 + level * 30);
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "rgba(165,243,252," + (0.3 + level * 0.6).toFixed(2) + ")";
    ctx.stroke();
  }

  function startViz() {
    if (rafId || document.hidden) return;
    resizeCanvas();
    rafId = requestAnimationFrame(drawVisualizer);
  }
  function stopViz() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    if (cw && ch) ctx.clearRect(0, 0, cw, ch);
  }

  if ("ResizeObserver" in window) {
    let roTimer = null;
    new ResizeObserver(() => {
      clearTimeout(roTimer);
      roTimer = setTimeout(resizeCanvas, 120);
    }).observe(canvas);
  } else {
    window.addEventListener("resize", () => setTimeout(resizeCanvas, 150), { passive: true });
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      stopViz();
    } else if (playing && !loading) {
      resumeContext();
      startViz();
    }
  });

  /* ---------- کاور ---------- */
  cover.onerror = function () {
    if (cover.src !== FALLBACK_IMG) cover.src = FALLBACK_IMG;
  };

  function changeCover(genre) {
    const data = genresData[genre];
    if (!data || !data.covers || data.covers.length < 2) return;
    coverIndex = (coverIndex + 1) % data.covers.length;
    const newImg = new Image();
    newImg.onload = function () {
      cover.classList.add("fade-out");
      clearTimeout(coverSwapTimer);
      coverSwapTimer = setTimeout(() => {
        cover.src = newImg.src;
        requestAnimationFrame(() => cover.classList.remove("fade-out"));
      }, 300);
    };
    newImg.src = data.covers[coverIndex];
  }

  function startCoverRotation() {
    stopCoverRotation();
    const data = genresData[currentGenre];
    if (mode === "live" && data && data.covers && data.covers.length > 1 && !document.hidden) {
      coverTimer = setInterval(() => changeCover(currentGenre), 12000);
    }
  }
  function stopCoverRotation() {
    if (coverTimer) { clearInterval(coverTimer); coverTimer = null; }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopCoverRotation();
    else if (playing && mode === "live") startCoverRotation();
  });

  /* ---------- رابط ---------- */
  function setPlayingUI(isPlaying) {
    playIcon.className = isPlaying ? "fas fa-pause" : "fas fa-play";
    waves.classList.toggle("paused", !isPlaying);
    liveBadge.classList.toggle("on", isPlaying && mode === "live");
    liveBadge.classList.toggle("off", !(isPlaying && mode === "live"));
    playBtn.classList.remove("loading");
  }

  function setLoadingUI(isLoading) {
    loading = isLoading;
    genresContainer.querySelectorAll(".genre").forEach(g => g.classList.toggle("disabled", isLoading));
    if (isLoading) {
      playIcon.className = "fas fa-spinner";
      playBtn.classList.add("loading");
    } else {
      playBtn.classList.remove("loading");
    }
  }

  function getStream(genre) {
    if (genre.startsWith("custom_")) {
      const idx = parseInt(genre.slice(7), 10);
      const s = customStreams[idx];
      return s ? { url: s.url, custom: true, stream: s } : null;
    }
    const data = genresData[genre];
    if (!data) return null;
    return { url: BASE_URL + (data.urlPath || genre), custom: false, stream: null };
  }

  function showGenreInfo(genre) {
    if (genre.startsWith("custom_")) {
      const s = customStreams[parseInt(genre.slice(7), 10)];
      if (s) {
        title.textContent = s.name;
        artist.textContent = "استریم سفارشی";
        cover.src = FALLBACK_IMG;
      }
    } else {
      const data = genresData[genre];
      if (data) {
        title.textContent = data.title;
        artist.textContent = data.artist;
        if (data.covers && data.covers[0]) cover.src = data.covers[0];
      }
    }
  }

  function showFilesInfo() {
    const item = localPlaylist[currentFileIndex];
    if (item) {
      title.textContent = item.name;
      artist.textContent = "فایل صوتی محلی";
    } else {
      title.textContent = localPlaylist.length ? "یک فایل را انتخاب کن" : "لیست خالی است";
      artist.textContent = "فایل صوتی محلی";
    }
    cover.src = FALLBACK_IMG;
  }

  function updateMediaSession() {
    if (!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: title.textContent, artist: artist.textContent, album: "رادیو ارک ماین"
      });
    } catch (_) {}
  }

  function setupMediaSessionHandlers() {
    if (!("mediaSession" in navigator)) return;
    const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (_) {} };
    set("play", () => { if (!playing) togglePlay(); });
    set("pause", () => { if (playing) togglePlay(); });
    set("previoustrack", () => { if (activeTab === "files") prevBtn.click(); });
    set("nexttrack", () => { if (activeTab === "files") nextBtn.click(); });
  }

  /* ---------- مدیریت المنت صوتی ---------- */
  function useElement(el) {
    if (audio === el) return;
    try {
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
    } catch (_) {}
    audio = el;
  }

  function applyVolume(v) {
    v = Math.max(0, Math.min(1, v));
    currentVolume = v;

    clearTimeout(saveVolTimer);
    saveVolTimer = setTimeout(() => store.set("radioVol", String(v)), 500);

    if (audioGraphReady && gainNode && audioContext) {
      const now = audioContext.currentTime;
      try {
        gainNode.gain.cancelScheduledValues(now);
        gainNode.gain.setTargetAtTime(v, now, 0.05);
      } catch (_) { gainNode.gain.value = v; }
      try { audioCors.volume = 1; } catch (_) {}
    } else {
      try { audioCors.volume = v; } catch (_) {}
    }
    try { audioPlain.volume = v; } catch (_) {}
  }

  function updateVolumeUI(v) {
    const percent = Math.round(v * 100);
    volumeValue.textContent = percent + "%";
    volumeSlider.value = percent;
    volumeSlider.style.setProperty("--vol-percent", percent + "%");
    muteIcon.className = "fas " +
      (v === 0 ? "fa-volume-xmark" : v < 0.33 ? "fa-volume-off" : v < 0.66 ? "fa-volume-low" : "fa-volume-high");
    muteBtn.classList.toggle("mute", v === 0);
  }

  function setVolume(v, opts) {
    const updateLast = !opts || opts.updateLast !== false;
    v = Math.max(0, Math.min(1, v));
    if (v > 0 && updateLast) lastVolume = v;
    applyVolume(v);
    updateVolumeUI(v);
  }

  /* ---------- پخش ---------- */
  function clearTimers() {
    clearTimeout(retryTimer);
    clearTimeout(waitTimer);
  }

  function pausePlayback(msg) {
    playRequestId++;           // هر درخواست در حال انجام را لغو می‌کند
    clearTimers();
    retryCount = 0;
    try { audio.pause(); } catch (_) {}
    if (mode === "live") {
      // اتصال زنده را رها می‌کنیم تا بافر کهنه پخش نشود و دیتا مصرف نشود
      audio.removeAttribute("src");
      try { audio.load(); } catch (_) {}
    }
    playing = false;
    setLoadingUI(false);
    setPlayingUI(false);
    stopCoverRotation();
    stopViz();
    statusEl.textContent = msg || "متوقف شد";
  }

  function onPlaySuccess() {
    setLoadingUI(false);
    playing = true;
    retryCount = 0;
    setPlayingUI(true);
    startViz();
    updateMediaSession();
  }

  async function startStream(isAuto) {
    isAuto = !!isAuto;
    if (loading && !isAuto) return;

    const genre = currentGenre;
    const info = getStream(genre);
    if (!info) { statusEl.textContent = "⚠️ استریم پیدا نشد"; return; }

    const reqId = ++playRequestId;
    mode = "live";
    clearTimeout(waitTimer);
    setLoadingUI(true);
    statusEl.textContent = isAuto ? "⏳ تلاش مجدد..." : "در حال اتصال...";

    const tryPlay = async (plain) => {
      if (plain) {
        useElement(audioPlain);
      } else {
        setupAudioGraph();
        useElement(audioCors);
        await resumeContext();
      }
      audio.src = info.url;   // همیشه از نو وصل می‌شویم تا استریم زنده باشد
      audio.load();
      await audio.play();
    };

    const plainFirst = !!(info.stream && info.stream.nocors);

    try {
      try {
        await tryPlay(plainFirst);
      } catch (err) {
        if (reqId !== playRequestId) return;
        // سرور CORS ندارد؟ یک بار بدون گراف صوتی امتحان می‌کنیم
        if (info.custom && !plainFirst && err && err.name !== "NotAllowedError" && err.name !== "AbortError") {
          info.stream.nocors = true;
          saveStreams();
          await tryPlay(true);
        } else {
          throw err;
        }
      }

      if (reqId !== playRequestId) return;

      currentGenre = genre;
      onPlaySuccess();
      statusEl.textContent = info.stream && info.stream.nocors
        ? "🎵 پخش زنده (بدون ویژوالایزر)"
        : "🎵 پخش زنده";
      coverIndex = 0;
      startCoverRotation();
    } catch (err) {
      if (reqId !== playRequestId) return;
      if (err && err.name === "AbortError") return;
      console.log("خطای پخش:", err);

      setLoadingUI(false);

      if (isAuto && retryCount < MAX_RETRIES) {
        playing = true;
        handleConnectionLoss();
        return;
      }

      playing = false;
      setPlayingUI(false);
      stopCoverRotation();
      stopViz();

      let msg = "⚠️ اتصال ناموفق؛ دوباره ▶️ را بزن";
      if (err && err.name === "NotAllowedError") msg = "⚠️ مرورگر اجازه پخش نداد؛ یک بار دیگر بزن";
      else if (err && err.name === "NotSupportedError") msg = "⚠️ این استریم پشتیبانی نمی‌شود یا در دسترس نیست";
      statusEl.textContent = msg;
    }
  }

  function handleConnectionLoss() {
    if (!playing || mode !== "live") return;
    clearTimers();

    if (retryCount >= MAX_RETRIES) {
      pausePlayback("⚠️ اتصال برقرار نشد؛ دوباره ▶️ را بزن");
      return;
    }
    retryCount++;
    statusEl.textContent = "⏳ اتصال قطع شد؛ تلاش مجدد (" + retryCount + ")...";
    playIcon.className = "fas fa-spinner";
    playBtn.classList.add("loading");

    retryTimer = setTimeout(() => {
      if (playing && mode === "live") startStream(true);
    }, Math.min(1500 * retryCount, 8000));
  }

  async function playLocalFile(index) {
    if (index < 0 || index >= localPlaylist.length) return;
    const reqId = ++playRequestId;
    clearTimers();
    retryCount = 0;

    const item = localPlaylist[index];
    const sameTrack = mode === "file" && index === currentFileIndex &&
      audio === audioCors && audio.getAttribute("src") === item.url && !audio.ended;

    currentFileIndex = index;
    mode = "file";
    renderPlaylist();

    title.textContent = item.name;
    artist.textContent = "فایل صوتی محلی";
    cover.src = FALLBACK_IMG;
    stopCoverRotation();

    setLoadingUI(true);
    statusEl.textContent = "در حال بارگذاری فایل...";

    try {
      setupAudioGraph();
      useElement(audioCors);
      await resumeContext();
      if (!sameTrack) audio.src = item.url;
      if (!audioGraphReady) { try { audioCors.volume = currentVolume; } catch (_) {} }
      await audio.play();
      if (reqId !== playRequestId) return;
      onPlaySuccess();
      statusEl.textContent = "🎵 در حال پخش فایل";
    } catch (err) {
      if (reqId !== playRequestId) return;
      if (err && err.name === "AbortError") return;
      setLoadingUI(false);
      playing = false;
      setPlayingUI(false);
      stopViz();
      statusEl.textContent = "⚠️ خطا در پخش فایل";
    }
  }

  function togglePlay() {
    if (playing || loading) {
      pausePlayback();
      return;
    }
    if (activeTab === "files") {
      if (localPlaylist.length === 0) {
        statusEl.textContent = "ابتدا یک فایل صوتی اضافه کن";
        return;
      }
      playLocalFile(currentFileIndex === -1 ? 0 : currentFileIndex);
    } else {
      startStream();
    }
  }

  /* ---------- رویدادهای صوتی (برای هر دو المنت) ---------- */
  function bindAudio(el) {
    const on = (type, fn) => el.addEventListener(type, (e) => { if (el === audio) fn(e); });

    on("playing", () => {
      clearTimeout(waitTimer);
      clearTimeout(retryTimer);
      if (!playing) return;
      setLoadingUI(false);
      setPlayingUI(true);
    });

    on("waiting", () => {
      if (!playing || loading) return;
      statusEl.textContent = "⏳ بافر کردن...";
      playIcon.className = "fas fa-spinner";
      playBtn.classList.add("loading");
      clearTimeout(waitTimer);
      if (mode === "live") waitTimer = setTimeout(handleConnectionLoss, 15000);
    });

    on("canplay", () => {
      clearTimeout(waitTimer);
      if (playing && !loading) {
        playBtn.classList.remove("loading");
        playIcon.className = "fas fa-pause";
        if (mode === "live") statusEl.textContent = el === audioPlain ? "🎵 پخش زنده (بدون ویژوالایزر)" : "🎵 پخش زنده";
      }
    });

    on("ended", () => {
      if (mode === "file" && localPlaylist.length > 0) {
        playLocalFile((currentFileIndex + 1) % localPlaylist.length);
      } else if (mode === "live") {
        handleConnectionLoss();
      }
    });

    on("error", () => {
      if (!playing || !el.getAttribute("src")) return;
      if (mode === "live") handleConnectionLoss();
      else if (mode === "file") {
        pausePlayback("⚠️ خطا در پخش فایل");
      }
    });
  }
  bindAudio(audioCors);
  bindAudio(audioPlain);

  window.addEventListener("online", () => {
    if (playing && mode === "live") {
      retryCount = 0;
      clearTimers();
      startStream(true);
    }
  });

  playBtn.addEventListener("click", togglePlay);

  /* ---------- ژانرها ---------- */
  function renderCustomGenres() {
    genresContainer.querySelectorAll(".custom-genre").forEach(el => el.remove());
    customStreams.forEach((s, i) => {
      const g = document.createElement("div");
      g.className = "genre custom-genre";
      g.dataset.stream = "custom_" + i;
      g.tabIndex = 0;
      g.setAttribute("role", "button");

      const ic = document.createElement("i");
      ic.className = "fas fa-link";
      const label = document.createElement("span");
      label.className = "genre-label";
      label.textContent = s.name;           // textContent: جلوگیری از تزریق HTML
      const del = document.createElement("button");
      del.type = "button";
      del.className = "genre-del";
      del.dataset.del = String(i);
      del.setAttribute("aria-label", "حذف");
      del.textContent = "×";

      g.append(ic, label, del);
      if (currentGenre === "custom_" + i) g.classList.add("active");
      genresContainer.appendChild(g);
    });
  }

  function deleteStream(i) {
    if (!customStreams[i]) return;
    if (!window.confirm("این استریم حذف شود؟")) return;
    const wasActive = currentGenre === "custom_" + i;

    customStreams.splice(i, 1);
    saveStreams();

    if (wasActive) {
      if (playing && mode === "live") pausePlayback();
      currentGenre = "phonk";
    } else if (currentGenre.startsWith("custom_")) {
      const ci = parseInt(currentGenre.slice(7), 10);
      if (ci > i) currentGenre = "custom_" + (ci - 1);
    }

    renderCustomGenres();
    genresContainer.querySelectorAll(".genre").forEach(g =>
      g.classList.toggle("active", g.dataset.stream === currentGenre));
    if (wasActive) {
      showGenreInfo(currentGenre);
      statusEl.textContent = DEFAULT_STATUS;
    }
  }

  function selectGenre(el) {
    if (loading) return;
    const genre = el.dataset.stream;
    if (genre === currentGenre && playing && mode === "live") return;

    currentGenre = genre;
    genresContainer.querySelectorAll(".genre").forEach(g => g.classList.remove("active"));
    el.classList.add("active");
    showGenreInfo(genre);
    coverIndex = 0;

    if (playing) {
      stopCoverRotation();
      retryCount = 0;
      startStream();
    } else {
      if (mode === "file") mode = null;
      statusEl.textContent = DEFAULT_STATUS;
    }
  }

  genresContainer.addEventListener("click", (e) => {
    const del = e.target.closest(".genre-del");
    if (del) {
      e.stopPropagation();
      deleteStream(parseInt(del.dataset.del, 10));
      return;
    }
    const el = e.target.closest(".genre");
    if (el && !el.classList.contains("disabled")) selectGenre(el);
  });

  genresContainer.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    if (e.target.classList && e.target.classList.contains("genre-del")) return;
    const el = e.target.closest(".genre");
    if (el && !el.classList.contains("disabled")) {
      e.preventDefault();
      e.stopPropagation(); // جلوگیری از اجرای میانبر Space سراسری (باگ پخش/توقف دوباره)
      selectGenre(el);
    }
  });

  /* ---------- صدا ---------- */
  volumeSlider.addEventListener("input", (e) => setVolume(parseFloat(e.target.value) / 100), { passive: true });

  muteBtn.addEventListener("click", () => {
    if (currentVolume > 0) { lastVolume = currentVolume; setVolume(0, { updateLast: false }); }
    else { setVolume(lastVolume || 1); }
  });

  /* ---------- میانبرهای کیبورد ---------- */
  window.addEventListener("keydown", (e) => {
    if (addStreamModal.classList.contains("open")) return;
    const t = e.target;
    const tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.code === "Space") {
      if (tag === "BUTTON" || (t.closest && t.closest(".genre"))) return; // خود دکمه کلیک را مدیریت می‌کند
      e.preventDefault();
      togglePlay();
    } else if (e.code === "KeyM") {
      e.preventDefault();
      muteBtn.click();
    } else if (e.code === "ArrowUp") {
      e.preventDefault();
      setVolume(currentVolume + 0.05);
    } else if (e.code === "ArrowDown") {
      e.preventDefault();
      setVolume(currentVolume - 0.05);
    }
  });

  /* ---------- تب‌ها ---------- */
  function switchTab(tab) {
    activeTab = tab;
    const isFiles = tab === "files";
    tabFilesBtn.classList.toggle("active", isFiles);
    tabRadioBtn.classList.toggle("active", !isFiles);
    filesTabView.classList.toggle("active", isFiles);
    radioTabView.classList.toggle("active", !isFiles);
    prevBtn.style.display = isFiles ? "flex" : "none";
    nextBtn.style.display = isFiles ? "flex" : "none";

    if (!playing && !loading) {
      if (isFiles) {
        showFilesInfo();
        statusEl.textContent = localPlaylist.length ? DEFAULT_STATUS : "برای پخش، فایل صوتی اضافه کن";
      } else {
        showGenreInfo(currentGenre);
        statusEl.textContent = DEFAULT_STATUS;
      }
    }
  }
  tabRadioBtn.addEventListener("click", () => switchTab("radio"));
  tabFilesBtn.addEventListener("click", () => switchTab("files"));

  /* ---------- مودال ---------- */
  function openModal() {
    formError.textContent = "";
    addStreamModal.classList.add("open");
    addStreamModal.setAttribute("aria-hidden", "false");
    setTimeout(() => streamNameInput.focus(), 150);
  }
  function closeModal() {
    addStreamModal.classList.remove("open");
    addStreamModal.setAttribute("aria-hidden", "true");
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  openModalBtn.addEventListener("click", openModal);
  closeModalBtn.addEventListener("click", closeModal);
  cancelModalBtn.addEventListener("click", closeModal);
  addStreamModal.addEventListener("click", (e) => { if (e.target === addStreamModal) closeModal(); });
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && addStreamModal.classList.contains("open")) closeModal();
  });
  [streamNameInput, streamUrlInput].forEach(inp =>
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); saveStream(); } }));

  function saveStream() {
    const name = streamNameInput.value.trim();
    const url = streamUrlInput.value.trim();

    if (!name || !url) { formError.textContent = "نام و آدرس را وارد کن"; return; }

    let parsed;
    try { parsed = new URL(url); } catch (_) { parsed = null; }
    if (!parsed || (parsed.protocol !== "http:" && parsed.protocol !== "https:")) {
      formError.textContent = "آدرس معتبر نیست (باید با http یا https شروع شود)";
      return;
    }
    if (location.protocol === "https:" && parsed.protocol === "http:") {
      formError.textContent = "این صفحه روی https است؛ مرورگر آدرس http را مسدود می‌کند";
      return;
    }
    if (customStreams.some(s => s.url === url)) { formError.textContent = "این آدرس قبلاً اضافه شده"; return; }

    customStreams.push({ name, url });
    saveStreams();

    streamNameInput.value = "";
    streamUrlInput.value = "";
    closeModal();

    renderCustomGenres();
    const lastEl = genresContainer.querySelector('.genre[data-stream="custom_' + (customStreams.length - 1) + '"]');
    if (lastEl) {
      selectGenre(lastEl);
      lastEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }
  saveStreamBtn.addEventListener("click", saveStream);

  /* ---------- فایل‌های محلی ---------- */
  const AUDIO_EXT = /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|weba|webm|mp4)$/i;

  dropZone.addEventListener("click", () => fileInput.click());
  dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener("change", (e) => {
    if (e.target.files.length > 0) handleFiles(e.target.files);
    fileInput.value = ""; // امکان انتخاب دوباره‌ی همان فایل
  });

  function handleFiles(files) {
    let added = 0;
    Array.from(files).forEach(file => {
      if ((file.type && file.type.startsWith("audio/")) || AUDIO_EXT.test(file.name)) {
        localPlaylist.push({ name: file.name, url: URL.createObjectURL(file) });
        added++;
      }
    });
    if (!added) { statusEl.textContent = "⚠️ فایل صوتی معتبری انتخاب نشد"; return; }
    renderPlaylist();
    if (currentFileIndex === -1 && !playing) playLocalFile(0);
    else if (!playing) showFilesInfo();
  }

  function renderPlaylist() {
    const frag = document.createDocumentFragment();
    localPlaylist.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "playlist-item" + (index === currentFileIndex ? " active" : "");
      row.dataset.index = String(index);

      const info = document.createElement("div");
      info.className = "item-info";
      const ic = document.createElement("i");
      ic.className = "fas fa-music";
      const nm = document.createElement("span");
      nm.textContent = item.name;           // textContent: جلوگیری از تزریق HTML از نام فایل
      info.append(ic, nm);

      const rm = document.createElement("i");
      rm.className = "fas fa-trash-can item-remove";
      rm.dataset.index = String(index);

      row.append(info, rm);
      frag.appendChild(row);
    });
    playlist.replaceChildren(frag);
  }

  playlist.addEventListener("click", (e) => {
    const rm = e.target.closest(".item-remove");
    if (rm) { e.stopPropagation(); removeLocalFile(parseInt(rm.dataset.index, 10)); return; }
    const row = e.target.closest(".playlist-item");
    if (row) playLocalFile(parseInt(row.dataset.index, 10));
  });

  function removeLocalFile(index) {
    const item = localPlaylist[index];
    if (!item) return;

    const wasCurrent = index === currentFileIndex;
    const wasPlaying = playing && mode === "file";

    if (wasCurrent) {
      playRequestId++;
      try { audio.pause(); } catch (_) {}
      if (mode === "file") { audio.removeAttribute("src"); try { audio.load(); } catch (_) {} }
    }
    URL.revokeObjectURL(item.url);
    localPlaylist.splice(index, 1);

    if (!wasCurrent && index < currentFileIndex) currentFileIndex--;   // قبلاً اصلاح نمی‌شد

    if (wasCurrent) {
      if (localPlaylist.length > 0) {
        const next = Math.min(index, localPlaylist.length - 1);
        currentFileIndex = next;
        renderPlaylist();
        if (wasPlaying) playLocalFile(next);
        else { playing = false; setLoadingUI(false); setPlayingUI(false); stopViz(); showFilesInfo(); }
        return;
      }
      currentFileIndex = -1;
      playing = false;
      mode = null;
      setLoadingUI(false);
      setPlayingUI(false);
      stopViz();
      title.textContent = "لیست خالی است";
      statusEl.textContent = "برای پخش، فایل صوتی اضافه کن";
    }
    renderPlaylist();
  }

  prevBtn.addEventListener("click", () => {
    if (!localPlaylist.length) return;
    let i = currentFileIndex - 1;
    if (i < 0) i = localPlaylist.length - 1;
    playLocalFile(i);
  });
  nextBtn.addEventListener("click", () => {
    if (!localPlaylist.length) return;
    playLocalFile((currentFileIndex + 1) % localPlaylist.length);
  });

  window.addEventListener("pagehide", () => {
    localPlaylist.forEach(i => URL.revokeObjectURL(i.url));
  });

  /* ---------- شروع ---------- */
  setVolume(currentVolume);
  renderCustomGenres();
  setupMediaSessionHandlers();

  cover.src = FALLBACK_IMG;
  const firstCover = new Image();
  firstCover.onload = () => { cover.src = firstCover.src; };
  firstCover.src = genresData[currentGenre].covers[0];

  resizeCanvas();
  statusEl.textContent = DEFAULT_STATUS;
})();
</script>
</body>
</html>
